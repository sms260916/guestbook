<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>26년 10월 23일에 창조된 방명록</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #25332d;
      --muted: #65736c;
      --green: #176c4c;
      --line: #dce5de;
      --paper: #fff;
      --bg: #f3f6f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Malgun Gothic", system-ui, sans-serif;
      line-height: 1.65;
    }
    main { width: min(720px, calc(100% - 32px)); margin: 44px auto; }
    header { margin-bottom: 24px; }
    h1 { margin: 4px 0; font-size: 32px; letter-spacing: -1px; }
    header p, time, .empty { color: var(--muted); }
    .card, .entry {
      margin-bottom: 16px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
    }
    label { display: block; margin: 12px 0; font-weight: 700; }
    input, textarea, button { font: inherit; }
    input, textarea {
      display: block;
      width: 100%;
      margin-top: 6px;
      padding: 10px 12px;
      border: 1px solid #b9c8bd;
      border-radius: 8px;
      color: var(--ink);
    }
    textarea { resize: vertical; }
    input:focus, textarea:focus, button:focus-visible {
      outline: 3px solid #a4d9bd;
      outline-offset: 2px;
    }
    button {
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    .notice, .error { padding: 12px; border-radius: 8px; }
    .notice { background: #e7f4eb; color: #165b3e; }
    .error { background: #fff0ef; color: #9c2924; }
    .entry h2 { margin: 0; font-size: 18px; }
    .entry time { font-size: 13px; }
    .message { margin: 14px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .empty { padding: 18px 4px; text-align: center; }
    @media (max-width: 520px) {
      main { margin: 24px auto; }
      h1 { font-size: 27px; }
      .card, .entry { padding: 18px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>26년 10월 23일에 창조된 방명록</h1>
      <p>찾아와 주셔서 대단히 감사해요.</p>
    </header>
    {{notice}}
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">글 남기기</h2>
      <form method="post" action="/">
        <label for="name">이름 (최대 40자)</label>
        <input id="name" name="name" type="text" maxlength="40" required>
        <label for="message">내용 (최대 1000자)</label>
        <textarea id="message" name="message" rows="4" maxlength="1000" required></textarea>
        <button type="submit">등록하기</button>
      </form>
    </section>
    <section aria-labelledby="entries-title">
      <h2 id="entries-title">최근 방명록</h2>
      {{entries}}
    </section>
  </main>
</body>
</html>
