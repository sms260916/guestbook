<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9e9e9">
  <title>26년 10월 23일에 창조된 방명록</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #574e59;
      --muted: #928795;
      --pink: #d77991;
      --pink-light: #fae8ed;
      --blue: #93aebe;
      --blue-light: #edf4f7;
      --line: #eadfe4;
      --paper: #fffdfc;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 12% 10%, #fff8f0 0, transparent 32%),
        radial-gradient(ellipse at 86% 24%, #f3eafa 0, transparent 30%),
        linear-gradient(145deg, #f9e9e9, #eaf3f5 58%, #f7efdf);
      color: var(--ink);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      line-height: 1.7;
    }
    .leaves {
      position: fixed;
      z-index: 0;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .leaf {
      position: absolute;
      top: -12vh;
      left: var(--left);
      color: var(--leaf-color);
      font-size: var(--size);
      opacity: .76;
      animation: leaf-fall var(--duration) linear var(--delay) infinite;
    }
    @keyframes leaf-fall {
      0% { transform: translate3d(0, -8vh, 0) rotate(0deg); }
      25% { transform: translate3d(36px, 23vh, 0) rotate(110deg); }
      55% { transform: translate3d(-26px, 55vh, 0) rotate(245deg); }
      78% { transform: translate3d(42px, 80vh, 0) rotate(350deg); }
      100% { transform: translate3d(-12px, 112vh, 0) rotate(500deg); }
    }
    .site {
      position: relative;
      z-index: 1;
      width: min(1080px, calc(100% - 32px));
      margin: 42px auto;
      padding: 24px;
      border: 1px solid #fff;
      border-radius: 20px;
      background: rgb(255 253 252 / 88%);
      box-shadow: 0 18px 55px rgb(112 91 112 / 13%);
      backdrop-filter: blur(5px);
    }
    .topline {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 0 4px 16px;
      border-bottom: 1px dashed #e8d9df;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .05em;
    }
    .layout {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 24px;
      padding-top: 22px;
    }
    .sidebar { display: flex; flex-direction: column; gap: 14px; }
    .profile, .side-card, .main-panel {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
    }
    .profile { overflow: hidden; }
    .profile-cover {
      height: 88px;
      background:
        radial-gradient(circle at 22% 38%, #fff9e6 0 10%, transparent 11%),
        radial-gradient(circle at 73% 65%, #f7d8df 0 16%, transparent 17%),
        linear-gradient(125deg, #eadcf1, #f5e4dc 55%, #dcecf0);
    }
    .avatar {
      display: grid;
      width: 74px;
      height: 74px;
      margin: -38px 18px 0;
      place-items: center;
      border: 4px solid var(--paper);
      border-radius: 50%;
      background: #f7e4e4;
      font-size: 34px;
    }
    .profile-body { padding: 4px 18px 18px; }
    .profile-body h2 { margin: 0; font-size: 17px; }
    .profile-body p { margin: 4px 0 12px; color: var(--muted); font-size: 13px; }
    .status {
      padding: 10px 12px;
      border-radius: 9px;
      background: #f6f0f6;
      color: #7e6a83;
      font-size: 12px;
    }
    .side-card { padding: 14px 16px; }
    .side-card h2 {
      margin: 0 0 8px;
      color: var(--pink);
      font-size: 13px;
      letter-spacing: .06em;
    }
    .menu { display: grid; gap: 5px; }
    .menu a {
      padding: 7px 9px;
      border-radius: 7px;
      color: var(--ink);
      font-size: 13px;
      text-decoration: none;
    }
    .menu a:hover, .menu a:focus-visible { background: var(--blue-light); }
    .side-note { color: var(--muted); font-size: 12px; }
    .main-panel { min-width: 0; overflow: hidden; }
    .panel-heading {
      padding: 23px 26px 17px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(100deg, #fff8f6, #f7f5fb 68%, #f1f7f8);
    }
    .eyebrow {
      color: var(--pink);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .15em;
    }
    h1 {
      margin: 3px 0 2px;
      font-family: "Georgia", "Malgun Gothic", serif;
      font-size: clamp(22px, 3vw, 30px);
      letter-spacing: -.04em;
    }
    .panel-heading p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .panel-content { padding: 20px 26px 26px; }
    .notice, .error {
      margin: 0 0 15px;
      padding: 10px 13px;
      border-radius: 9px;
      font-size: 13px;
    }
    .notice { background: #edf6ef; color: #557a61; }
    .error { background: #fff0f0; color: #9c5862; }
    .card-title {
      display: flex;
      gap: 9px;
      align-items: center;
      margin: 0 0 12px;
      font-size: 16px;
    }
    .card-title::before { color: var(--pink); content: "✿"; }
    .write-card {
      margin-bottom: 24px;
      padding: 16px;
      border: 1px solid #eee3e7;
      border-radius: 12px;
      background: #fffbfa;
    }
    label { display: block; margin: 10px 0; color: #716673; font-size: 13px; font-weight: 700; }
    input, textarea, button { font: inherit; }
    input, textarea {
      display: block;
      width: 100%;
      margin-top: 5px;
      padding: 9px 11px;
      border: 1px solid #e3d8df;
      border-radius: 8px;
      background: white;
      color: var(--ink);
      font-size: 14px;
    }
    textarea { resize: vertical; }
    input:focus, textarea:focus, button:focus-visible, summary:focus-visible, a:focus-visible {
      outline: 3px solid #edc4d0;
      outline-offset: 2px;
    }
    button {
      padding: 8px 15px;
      border: 0;
      border-radius: 8px;
      background: var(--pink);
      color: white;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #c96580; }
    .board-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
    }
    .board-heading h2 { margin: 0; font-size: 16px; }
    .board-heading span { color: var(--muted); font-size: 11px; }
    .entry {
      margin: 0 0 12px;
      padding: 15px;
      border: 1px solid #ece2e6;
      border-radius: 11px;
      background: white;
    }
    .entry-heading { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 5px 12px; align-items: baseline; }
    .entry-heading h3 { margin: 0; color: #6c5a70; font-size: 14px; }
    time { color: #a398a3; font-size: 11px; }
    .message { margin: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
    .reply-box { margin-top: 10px; color: var(--pink); font-size: 12px; }
    .reply-box summary { width: fit-content; cursor: pointer; font-weight: 700; }
    .reply-box form { padding: 5px 0 10px; }
    .replies {
      display: grid;
      gap: 8px;
      margin-top: 12px;
      padding-left: 15px;
      border-left: 2px solid #f1dce3;
    }
    .reply {
      padding: 10px 12px;
      border-radius: 8px;
      background: #fcf7f9;
    }
    .reply .message { margin-bottom: 0; font-size: 13px; }
    .reply-empty { margin: 0; color: #ad9faa; font-size: 11px; }
    .empty { padding: 22px 10px; color: var(--muted); text-align: center; font-size: 13px; }
    @media (max-width: 720px) {
      .site { margin: 16px auto; padding: 16px; }
      .layout { grid-template-columns: 1fr; gap: 16px; }
      .sidebar { display: grid; grid-template-columns: 1fr 1fr; }
      .profile { grid-row: span 2; }
      .panel-heading { padding: 20px 18px 15px; }
      .panel-content { padding: 16px 18px 20px; }
    }
    @media (max-width: 480px) {
      .site { width: calc(100% - 20px); margin: 10px auto; padding: 12px; border-radius: 15px; }
      .topline { font-size: 10px; }
      .sidebar { grid-template-columns: 1fr; }
      .profile { grid-row: auto; }
      .panel-content { padding: 14px 12px 16px; }
      .write-card { padding: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .leaves { display: none; }
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="leaves" aria-hidden="true">
    <span class="leaf" style="--left:8%;--size:22px;--duration:17s;--delay:-8s;--leaf-color:#d998a7">🍂</span>
    <span class="leaf" style="--left:22%;--size:16px;--duration:21s;--delay:-15s;--leaf-color:#d6b071">🍁</span>
    <span class="leaf" style="--left:39%;--size:19px;--duration:19s;--delay:-3s;--leaf-color:#c994a7">🍂</span>
    <span class="leaf" style="--left:57%;--size:15px;--duration:23s;--delay:-12s;--leaf-color:#c9a96e">🍁</span>
    <span class="leaf" style="--left:73%;--size:21px;--duration:18s;--delay:-6s;--leaf-color:#d998a7">🍂</span>
    <span class="leaf" style="--left:91%;--size:17px;--duration:22s;--delay:-17s;--leaf-color:#c994a7">🍁</span>
  </div>
  <main class="site">
    <div class="topline">
      <span>♡ MY LITTLE AUTUMN HOME</span>
      <span>오늘도 포근한 하루</span>
    </div>
    <div class="layout">
      <aside class="sidebar" aria-label="미니홈피 프로필">
        <section class="profile">
          <div class="profile-cover"></div>
          <div class="avatar" aria-hidden="true">🍁</div>
          <div class="profile-body">
            <h2>가을의 작은 방</h2>
            <p>소소한 안부를 나누어요</p>
            <div class="status">오늘의 기분 · 따뜻한 차 한 잔 ☕</div>
          </div>
        </section>
        <section class="side-card">
          <h2>MENU</h2>
          <nav class="menu" aria-label="방명록 메뉴">
            <a href="#home">미니홈</a>
            <a href="#write">글 남기기</a>
            <a href="#guestbook">방명록</a>
          </nav>
        </section>
        <section class="side-card side-note">
          천천히 머물다 가세요.<br>남겨주신 마음을 소중히 읽을게요.
        </section>
      </aside>
      <section class="main-panel" id="home">
        <header class="panel-heading">
          <div class="eyebrow">MINI HOME · GUESTBOOK</div>
          <h1>26년 10월 23일에 창조된 방명록</h1>
          <p>찾아와 주셔서 대단히 감사해요.</p>
        </header>
        <div class="panel-content">
          {{notice}}
          <section class="write-card" id="write" aria-labelledby="form-title">
            <h2 class="card-title" id="form-title">새 글 남기기</h2>
            <form method="post" action="/">
              <label>이름
                <input name="name" type="text" maxlength="40" required>
              </label>
              <label>하고 싶은 이야기
                <textarea name="message" rows="3" maxlength="1000" required></textarea>
              </label>
              <button type="submit">방명록에 남기기</button>
            </form>
          </section>
          <section id="guestbook" aria-labelledby="entries-title">
            <div class="board-heading">
              <h2 id="entries-title">방명록</h2>
              <span>최근 글부터 보여드려요</span>
            </div>
            {{entries}}
          </section>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
